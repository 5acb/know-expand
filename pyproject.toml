[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "know-expand"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Document parsing
    "docling>=2.0.0",
    # NLP / extraction
    "spacy>=3.7.0",
    "keybert",
    "sentence-transformers>=3.0.0",   # BGE-M3
    "numpy>=1.26.0",
    # LLM routing + structured outputs
    "litellm>=1.40.0",
    "anthropic>=0.30.0",
    "instructor>=1.3.0",
    "pydantic>=2.7.0",
    # Pipeline orchestration + agent loops
    "langgraph>=0.2.0",
    # Observability (serve renders markdown in browser)
    "markdown>=3.6",
    # Rate limiting
    "aiolimiter>=1.1.0",
    # HTTP
    "httpx>=0.27.0",
    # PDF integrity check
    "pypdf>=6.16.1",
    # .env loading
    "python-dotenv>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "mem0ai>=0.1.0",
    "qdrant-client>=1.9.0",
]

[project.scripts]
know-expand = "know_expand.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "deepeval>=4.0.6",
]
