[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-expand"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Document parsing
    "docling>=2.0.0",
    # Chunking tokenizer
    "tiktoken",
    # NLP / extraction
    "spacy>=3.7.0",
    "keybert",
    "sentence-transformers>=3.0.0",   # BGE-M3
    "numpy>=1.26.0",
    # LLM routing
    "litellm>=1.40.0",
    "anthropic>=0.30.0",
    # Structured outputs
    "instructor>=1.3.0",
    "pydantic>=2.7.0",
    # Pipeline orchestration
    "langgraph>=0.2.0",
    # Adversarial loops
    "dspy>=2.6.0",
    # Rate limiting
    "aiolimiter>=1.1.0",
    # HTTP
    "httpx>=0.27.0",
    # PDF integrity check
    "pypdf>=4.2.0",
    # Caching
    "diskcache>=5.6.0",
    # Terminal UI
    "rich>=13.7.0",
    # Data validation
    "pandera>=0.19.0",
    # Retry
    "tenacity>=8.2.0",
]

[project.scripts]
doc-expand = "doc_expand.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
