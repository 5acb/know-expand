roles:
  # Slot 0 everywhere: geminicli/gemini-3.5-flash — free OAuth CLI.
  # Slot 1 everywhere: gemini/gemini-3.5-flash — best paid API fallback (GEMINI_API_KEY set).
  # No Chinese API providers. Local = llamacpp/glm4 on foiba (192.168.1.117:8080).
  #
  # Effective quality order (when geminicli quota-exhausted):
  #   gemini/gemini-3.5-flash  >  groq/llama-3.3-70b  >  mistral-small  >  groq/llama-3.1-8b  >  llamacpp
  #
  # Pricing reference ($/M in–out):
  #   geminicli            free
  #   gemini-3.5-flash     $0.30 / $2.50   solid mid-tier, best available API fallback
  #   groq/llama-3.1-8b    $0.05 / $0.08   bulk floor
  #   groq/llama-3.3-70b   $0.59 / $0.79   (free tier; batch+cache → ~$0.15/$0.20)
  #   mistral-small-latest $0.15 / $0.60   256K context, European
  #   gpt-4o-mini          $0.15 / $0.60
  #   claude-sonnet-4-6    $3.00 / $15.00
  #   claude-opus-4-7      $5.00 / $25.00  ← researcher/synthesizer only

  # Tool calling, multi-turn ReAct — correctness over cost, low volume.
  agent:
    - "geminicli/gemini-3.5-flash"
    - "gemini/gemini-3.5-flash"
    - "groq/llama-3.3-70b-versatile"
    - "claude-sonnet-4-6"
    - "llamacpp/glm4"

  # Long output, quality IS the product — no cheap shortcuts.
  researcher:
    - "geminicli/gemini-3.5-flash"
    - "gemini/gemini-3.5-flash"
    - "groq/llama-3.3-70b-versatile"
    - "mistral/mistral-small-latest"
    - "claude-opus-4-7"
    - "claude-sonnet-4-6"
    - "gpt-4o"
    - "llamacpp/glm4"

  synthesizer:
