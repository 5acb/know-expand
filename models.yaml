roles:
  # Slot 0: gemini/gemini-2.5-flash     — $0.30/$2.50 per M — cheapest quality paid provider
  # Slot 1: gemini/gemini-3.5-flash     — $1.50/$9.00 per M — quality backstop if 2.5-flash quota hits
  #
  # "No Chinese API providers" means: never send document/prompt data to a
  # China-operated endpoint (Alibaba Cloud, Zhipu/Z.ai, Moonshot's own APIs).
  # It does NOT ban Chinese-origin open-weight models outright — GLM-5.2 and
  # Kimi-K2.7-Code below are served through DeepInfra (Palo Alto, CA; US
  # data centers; SOC 2 / ISO 27001; zero data retention), so the weights are
  # Chinese-authored but inference and data handling never leave the US.
  # Qwen3.8-Max's open weights (released 2026-08-12) are NOT yet on DeepInfra
  # or any other non-Chinese host we've confirmed — do not add
  # "qwen/..." pointed at Alibaba Cloud's own API. Revisit once a Western
  # host picks it up.
  #
  # Open-weight fallback tier = DeepInfra (deepinfra/*), a single
  # OpenAI-compatible pay-as-you-go host — replaces the old Groq / Mistral /
  # local llama.cpp / geminicli patchwork with one provider, one API key,
  # one quota model.
  #
  # NVIDIA Nemotron 3 Ultra is served via NVIDIA's own NIM API
  # (nvidia_nim/* — litellm-native prefix, api.nvidia.com, US company) since
  # it isn't on DeepInfra yet. Needs NVIDIA_API_KEY. Verify the exact litellm
  # provider string against current litellm docs before relying on it in prod —
  # this was not smoke-tested against a live NIM endpoint.
  #
  # WARNING: gemini/gemini-3.5-flash (Google I/O 2026) ≠ gemini/gemini-2.5-flash.
  # 3.5-flash costs 5× more. Keep it as a backstop, not the primary paid fallback.
  #
  # DeepInfra / NVIDIA NIM models used:
  #   deepinfra/meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo   $0.03/$0.05  bulk floor
  #   deepinfra/meta-llama/Llama-3.3-70B-Instruct-Turbo       $0.13/$0.40  workhorse
  #   deepinfra/mistralai/Mistral-Small-24B-Instruct-2501     $0.05/$0.10  reasoning alt
  #   deepinfra/zai-org/GLM-5.2                               $0.75/$2.40  strong open-weight, long-horizon
  #   deepinfra/moonshotai/Kimi-K2.7-Code                     $0.68/$3.40  strong tool-calling/structured-output
  #   nvidia_nim/nemotron-3-ultra-550b-a55b                   $0.50/$2.20  1M ctx, agent-oriented, unconfirmed slug
  #
  # Effective cost order:
  #   gemini/gemini-2.5-flash                               $0.30/$2.50  ← use this first
  #   deepinfra/meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo  $0.03/$0.05  bulk floor (extractor/classifier only)
  #   deepinfra/mistralai/Mistral-Small-24B-Instruct-2501    $0.05/$0.10
  #   nvidia_nim/nemotron-3-ultra-550b-a55b                  $0.50/$2.20
  #   deepinfra/moonshotai/Kimi-K2.7-Code                    $0.68/$3.40
  #   deepinfra/zai-org/GLM-5.2                              $0.75/$2.40
  #   deepinfra/meta-llama/Llama-3.3-70B-Instruct-Turbo      $0.13/$0.40
  #   gpt-4o-mini                                            $0.15/$0.60
  #   gemini/gemini-3.5-flash                                $1.50/$9.00  ← quality backstop only
  #   claude-sonnet-5                                        $2.00/$10.00
  #   claude-opus-5                                          $5.00/$25.00 ← researcher/synthesizer only

  # Tool calling, multi-turn ReAct — correctness over cost, low volume.
  # Kimi-K2.7-Code is coding-tuned and tends to have strong structured/
  # function-calling reliability, which is exactly this role's requirement.
  agent:
    - "gemini/gemini-2.5-flash"
    - "gemini/gemini-3.5-flash"
    - "deepinfra/moonshotai/Kimi-K2.7-Code"
    - "deepinfra/meta-llama/Llama-3.3-70B-Instruct-Turbo"
    - "claude-sonnet-5"

  # Long output, quality IS the product — no cheap shortcuts.
  # Nemotron 3 Ultra's 1M context and agent-orientation make it a strong
  # open-weight rung between the DeepInfra workhorse tier and closed frontier models.
  researcher:
    - "claude-opus-5"
    - "claude-sonnet-5"
    - "gpt-4o-mini"
    - "gemini/gemini-3.5-flash"
    - "gemini/gemini-2.5-flash"
    - "nvidia_nim/nemotron-3-ultra-550b-a55b"
    - "deepinfra/zai-org/GLM-5.2"
    - "deepinfra/mistralai/Mistral-Small-24B-Instruct-2501"
    - "deepinfra/meta-llama/Llama-3.3-70B-Instruct-Turbo"

  synthesizer:
    - "claude-opus-5"
    - "claude-sonnet-5"
    - "gpt-4o-mini"
    - "gemini/gemini-3.5-flash"
    - "gemini/gemini-2.5-flash"
    - "nvidia_nim/nemotron-3-ultra-550b-a55b"
    - "deepinfra/zai-org/GLM-5.2"
    - "deepinfra/mistralai/Mistral-Small-24B-Instruct-2501"
    - "deepinfra/meta-llama/Llama-3.3-70B-Instruct-Turbo"

  # Reasoning matters, medium volume.
  critic:
    - "gemini/gemini-2.5-flash"
    - "deepinfra/zai-org/GLM-5.2"
    - "deepinfra/mistralai/Mistral-Small-24B-Instruct-2501"
    - "gemini/gemini-3.5-flash"
    - "deepinfra/meta-llama/Llama-3.3-70B-Instruct-Turbo"
    - "gpt-4o-mini"

  # Bulk structured JSON, runs per-chunk — cheapest DeepInfra model first, then escalate.
  extractor:
    - "deepinfra/meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo"
    - "deepinfra/meta-llama/Llama-3.3-70B-Instruct-Turbo"
    - "gemini/gemini-2.5-flash"
    - "deepinfra/mistralai/Mistral-Small-24B-Instruct-2501"

  # Highest volume, simplest task — 8B first.
  classifier:
    - "deepinfra/meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo"
    - "deepinfra/meta-llama/Llama-3.3-70B-Instruct-Turbo"
    - "gemini/gemini-2.5-flash"
    - "deepinfra/mistralai/Mistral-Small-24B-Instruct-2501"
    - "gpt-4o-mini"

  # Structured doc gen, benefits from large context.
  assembler:
    - "gemini/gemini-2.5-flash"
    - "nvidia_nim/nemotron-3-ultra-550b-a55b"
    - "deepinfra/mistralai/Mistral-Small-24B-Instruct-2501"
    - "gemini/gemini-3.5-flash"
    - "claude-sonnet-5"

  # Stage 7b Quality Evaluator — agent-as-judge scoring, same tier as
  # `critic`: reasoning/scoring over finished text, not long-form generation,
  # low-medium volume (one call per domain + one for the cross-domain
  # synthesis). Uses the DeepInfra / NVIDIA NIM open-weight fallback tier
  # (replaces Groq/Mistral/llama.cpp/geminicli) — do not reintroduce those.
  quality_evaluator:
    - "gemini/gemini-2.5-flash"
    - "deepinfra/zai-org/GLM-5.2"
    - "deepinfra/mistralai/Mistral-Small-24B-Instruct-2501"
    - "gemini/gemini-3.5-flash"
    - "deepinfra/meta-llama/Llama-3.3-70B-Instruct-Turbo"
    - "gpt-4o-mini"

  # S8 ensemble claim verification — debiased LLM-as-judge panel (Zheng et al.,
  # MT-Bench/Chatbot Arena). Two proposers from different provider families
  # answer the same claim/abstract entailment prompt; a third family
  # adjudicates only when they disagree. Each role's fallback chain is kept
  # within its own family on purpose — a fallback shouldn't quietly collapse
  # the "three distinct vendors" property the panel depends on.
  verifier_proposer_a:
    - "gemini/gemini-2.5-flash"
    - "gemini/gemini-3.5-flash"

  verifier_proposer_b:
    - "gpt-4o-mini"
    - "deepinfra/meta-llama/Llama-3.3-70B-Instruct-Turbo"

  # Only invoked on proposer disagreement — cost matters less here, so this
  # can afford to be the stronger tie-breaker.
  verifier_adjudicator:
    - "claude-sonnet-5"
    - "claude-opus-5"
