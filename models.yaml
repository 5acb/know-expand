roles:
  # Slot 0: gemini/gemini-2.5-flash     — $0.30/$2.50 per M — cheapest quality paid provider
  # Slot 1: gemini/gemini-3.5-flash     — $1.50/$9.00 per M — quality backstop if 2.5-flash quota hits
  # No Chinese API providers. Local = llamacpp/glm4 (http://localhost:8080).
  #
  # WARNING: gemini/gemini-3.5-flash (Google I/O 2026) ≠ gemini/gemini-2.5-flash.
  # 3.5-flash costs 5× more. Keep it as a backstop, not the primary paid fallback.
  #
  # Effective cost order:
  #   gemini/gemini-2.5-flash  $0.30/$2.50  ← use this first
  #   mistral-small-latest     $0.15/$0.60  256K ctx, MoE, European
  #   groq/llama-3.1-8b        $0.05/$0.08  bulk floor (extractor/classifier only)
  #   groq/llama-3.3-70b       $0.59/$0.79  free tier: ~500K tok/day aggregate cap
  #   gpt-4o-mini              $0.15/$0.60
  #   gemini/gemini-3.5-flash  $1.50/$9.00  ← quality backstop only
  #   claude-sonnet-4-6        $3.00/$15.00
  #   claude-opus-4-7          $5.00/$25.00 ← researcher/synthesizer only
  #
  # Expected cost per standard run:
  #   ~$0.73/run   (vs ~$3.59 if 3.5-flash were slot 0)
  # Deep run: ~$1.60/run

  # Tool calling, multi-turn ReAct — correctness over cost, low volume.
  agent:
    - "gemini/gemini-2.5-flash"
    - "gemini/gemini-3.5-flash"
    - "groq/llama-3.3-70b-versatile"
    - "claude-sonnet-4-6"
    - "llamacpp/glm4"

  # Long output, quality IS the product — no cheap shortcuts.
  researcher:
    - "claude-opus-4-7"
    - "claude-sonnet-4-6"
    - "gpt-4o"
    - "gemini/gemini-3.5-flash"
    - "gemini/gemini-2.5-flash"
    - "mistral/mistral-small-latest"
    - "groq/llama-3.3-70b-versatile"
    - "llamacpp/glm4"

  synthesizer:
    - "claude-opus-4-7"
    - "claude-sonnet-4-6"
    - "gpt-4o"
    - "gemini/gemini-3.5-flash"
    - "gemini/gemini-2.5-flash"
    - "mistral/mistral-small-latest"
    - "groq/llama-3.3-70b-versatile"
    - "llamacpp/glm4"

  # Reasoning matters, medium volume.
  critic:
    - "gemini/gemini-2.5-flash"
    - "mistral/mistral-small-latest"
    - "gemini/gemini-3.5-flash"
    - "groq/llama-3.3-70b-versatile"
    - "gpt-4o-mini"
    - "llamacpp/glm4"

  # Bulk structured JSON, runs per-chunk — groq 8B first for speed/cost, then escalate.
  extractor:
    - "groq/llama-3.1-8b-instant"
    - "groq/llama-3.3-70b-versatile"
    - "gemini/gemini-2.5-flash"
    - "mistral/mistral-small-latest"
    - "llamacpp/glm4"

  # Highest volume, simplest task — 8B first.
  classifier:
    - "groq/llama-3.1-8b-instant"
    - "groq/llama-3.3-70b-versatile"
    - "gemini/gemini-2.5-flash"
    - "mistral/mistral-small-latest"
    - "gpt-4o-mini"
    - "llamacpp/glm4"

  # Structured doc gen, benefits from large context.
  assembler:
    - "gemini/gemini-2.5-flash"
    - "mistral/mistral-small-latest"
    - "gemini/gemini-3.5-flash"
    - "claude-sonnet-4-6"
    - "llamacpp/glm4"
