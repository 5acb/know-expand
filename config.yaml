bibliography:
  foundational_fraction: 0.65
  frontier_months: 24
  depth_totals:
    survey: 10
    standard: 30
    deep: 50
  ss_max_retries: 5
  ss_retry_initial_delay: 30.0   # first 429 cooldown: 30s, then doubles
  ss_max_backoff: 120.0           # cap backoff at 2 min
  ss_anchors_n: 3
  # Junk-venue filter (S4 bibliography). Drops Semantic Scholar results whose
  # venue matches any regex below (case-insensitive) or whose DOI starts with
  # one of the prefixes. Self-uploads on these platforms accrue 10-35 citations
  # within months and crowd peer-reviewed work out of the frontier bucket.
  # arXiv is intentionally NOT listed: frontier CS work lives there.
  # Dropped rows are counted in the `ss_junk_filtered` event.
  junk_venue_filter: true
  junk_venues:
    - "zenodo"
    - "ssrn"
    - "research\\s*square"
    - "techrxiv"
  junk_doi_prefixes:
    - "10.5281/zenodo"   # Zenodo
    - "10.2139/ssrn"     # SSRN
    - "10.21203/"        # Research Square
    - "10.36227/"        # TechRxiv

centrality:
  structural_weight: 2.0
  core_effective_threshold: 10.0
  core_chunk_fraction: 0.4
  supporting_effective_threshold: 4.0
  alias_cosine_threshold: 0.92

rate_limits:
  semantic_scholar:
    max_rate: 1
    time_period: 1    # authenticated key: 1 req/sec
  crossref:
    max_rate: 1
    time_period: 1
  openalex:
    max_rate: 10
    time_period: 1

concurrency:
  default: 8

timeouts:
  domain_research_seconds: 2700
  http_fetch_seconds: 30
  openalex_seconds: 10
  http_async_seconds: 30
  # OpenAlex enforces a small daily USD budget per caller separately from its
  # req/s rate limit. A 429 whose Retry-After exceeds this threshold (or whose
  # body says "Insufficient budget") is treated as exhausted-for-the-day, not
  # a transient rate limit — see sources.py::_parse_openalex_budget_error.
  openalex_budget_retry_after_threshold_s: 600

adversarial_rounds:
  survey: 1
  standard: 2
  deep: 3

nlp_models:
  spacy: "en_core_web_sm"
  embedding: "BAAI/bge-m3"
  tokenizer: "cl100k_base"

chunking:
  word_size: 800
  max_tokens: 4000
  spacy_char_limit: 50000
  llm_map_char_limit: 6000

keyword_extraction:
  top_n: 20
  ngram_min: 1
  ngram_max: 3

graph_defaults:
  node_tier: "journeyman"
  node_xp: 100

# S5 persona prompt sizing.
# knowledge sources caps: survey=~1.5k / standard=~3.2k / deep=~15k chars.
# All well under the ~44k that caused geminicli timeouts.
# Raise deep.sources_max_terms if domain has 11+ core nodes and output quality is thin.
research_context:
  nodes_top_n: 30
  sources_max_terms:
    survey: 5
    standard: 8
    deep: 15
  sources_max_per_term:
    survey: 1
    standard: 1
    deep: 2
  sources_max_chars:
    survey: 300
    standard: 400
    deep: 500

critic_thinking:
  budget_tokens: 0

# Memory settings for Mem0 + Qdrant container
memory:
  provider: "qdrant"
  host: "localhost"
  port: 6333
  collection_name: "know_expand_memory"

boilerplate_stop_list:
  - introduction
  - methodology
  - conclusion
  - figure
  - table
  - theorem
  - proof
  - lemma
  - et al
  - appendix
  - section
  - related work
  - abstract
  - references
  - background
  - overview

