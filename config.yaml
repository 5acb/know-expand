llamacpp:
  base_url: "http://192.168.1.117:8080"
  max_tokens: 1024

bibliography:
  foundational_fraction: 0.65
  frontier_months: 24
  depth_totals:
    survey: 10
    standard: 30
    deep: 50
  ss_max_retries: 5
  ss_retry_initial_delay: 30.0   # first 429 cooldown: 30s, then doubles
  ss_max_backoff: 120.0           # cap backoff at 2 min
  ss_anchors_n: 3

centrality:
  structural_weight: 2.0
  core_effective_threshold: 5.0
  core_chunk_fraction: 0.3
  supporting_effective_threshold: 2.0
  alias_cosine_threshold: 0.92

rate_limits:
  semantic_scholar:
    max_rate: 1
    time_period: 20   # 1 req/20s = 3/min; SS unauthenticated is ~5/min but be conservative
  crossref:
    max_rate: 1
    time_period: 1
  openalex:
    max_rate: 10
    time_period: 1

concurrency:
  cloud_default: 8
  local_default: 2

timeouts:
  domain_research_seconds: 2700
  http_fetch_seconds: 30
  openalex_seconds: 10
  http_async_seconds: 30

adversarial_rounds:
  survey: 1
  standard: 2
  deep: 3

nlp_models:
  spacy: "en_core_web_sm"
  embedding: "BAAI/bge-m3"
  tokenizer: "cl100k_base"

chunking:
  word_size: 800
  max_tokens: 4000
  spacy_char_limit: 50000
  llm_map_char_limit: 6000

keyword_extraction:
  top_n: 20
  ngram_min: 1
  ngram_max: 3

graph_defaults:
  node_tier: "journeyman"
  node_xp: 100

boilerplate_stop_list:
  - introduction
  - methodology
  - conclusion
  - figure
  - table
  - theorem
  - proof
  - lemma
  - et al
  - appendix
  - section
  - related work
  - abstract
  - references
  - background
  - overview
